<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f1115; color: #e6e8ee; font: 16px system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  form { width: min(560px, 86vw); }
  img { display: block; width: 72px; height: 72px; margin: 0 auto 14px; }
  p { margin: 0 0 22px; color: #8b93a7; font-size: 14px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; letter-spacing: -.5px; text-align: center; }
  input { width: 100%; box-sizing: border-box; padding: 14px 20px; border: 1px solid #2a3040; border-radius: 28px; background: #171a21; color: inherit; font: inherit; outline: none; }
  input:focus { border-color: #6ea8ff; }
</style>
</head>
<body>
<form action="https://duckduckgo.com/" method="get">
  <img src="logo.png" alt="">
  <h1>Nimvane</h1>
  <p>Less weight. More web.</p>
  <input name="q" placeholder="Search privately" autofocus autocomplete="off">
</form>
</body>
</html>
