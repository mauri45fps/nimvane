<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Resource usage</title>
  <link rel="stylesheet" href="usage.css">
</head>
<body>
  <header>
    <div>
      <div class="label">Nimvane is using</div>
      <div class="big"><span id="mem">…</span><span class="sub" id="cpu"></span></div>
    </div>
    <button id="close" title="Close (Esc)">×</button>
  </header>

  <section>
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>Tabs</h2>
    <div id="tabs"></div>
  </section>

  <section>
    <h2>How to slim it down</h2>
    <ul id="tips"></ul>
  </section>

  <footer>
    <div class="stats" id="stats"></div>
    <button id="sleepAll">Sleep background tabs</button>
  </footer>
  <script src="usage.js"></script>
</body>
</html>
